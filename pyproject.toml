[tool.poetry]
name = "flockwave-server"
version = "2.14.0"
description = "Skybrush server component"
authors = ["Tamas Nepusz <tamas@collmot.com>", "Gabor Vasarhelyi <vasarhelyi@collmot.com>", "Gaal Botond <kisgal98@gmail.com>"]
license = "GPL-3.0-or-later"
packages = [
    { include = "flockwave", from = "src" }
]

# Upstream also declares a private "collmot" index (https://pypi.collmot.com/simple/)
# supplying optional commercial skybrush-ext-* extensions. This fork removes it, along
# with those optional dependencies and the extras that referenced them: we have no
# credentials for that index, and taht made every dependency resolution (poetry lock, 
# poetry add) fail.

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[[tool.poetry.source]]
name = "fury"
url = "https://pypi.fury.io/skybrush/"
priority = "supplemental"

[tool.poetry.dependencies]
# Upper bound: the locked motioncapture and numpy versions publish
# no wheels above CPython 3.11. 
python = ">=3.9,<3.12"
bidict = ">=0.22.1"
click = "^8.1.7"
blinker = "^1.7.0"
jsonschema = "^4.20.0"
python-baseconv = "^1.2.2"
pynmea2 = "^1.19.0"
trio = "0.24.0"
quart = ">=0.19.4"
quart-trio = ">=0.11.1"
trio-util = ">=0.7.0"
python-dotenv = ">=1.0.0"
colour = ">=0.1.5"
pyjwt = "^2.8.0"
hypercorn = {extras = ["trio"], version = ">=0.16.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
flockwave-app-framework = {version = "^2.6.0", extras = ["daemon"], source = "fury"}
flockwave-async = {version = "^1.3.0", source = "fury"}
flockwave-conn = {extras = ["rpc", "serial"], source = "fury", version = "^6.3.2" }
flockwave-ext = {version = "^1.24.3", source = "fury"}
flockwave-gps = {version = "^2.3.3", source = "fury"}
flockwave-logger = {version = "^1.9.0", source = "fury"}
flockwave-mavlink = {version = ">=0.1.0", source = "fury"}
flockwave-net = { extras = ["async"], version = "^6.0.1", source = "fury" }
flockwave-parsers = {version = "^2.1.0", source = "fury"}
flockwave-spec = { version = "^1.80.0", source = "fury" }
pyledctrl = {version = "^4.1.0", source = "fury"}
aiocflib = "^4.0.1"
appdirs = "^1.4.4"
crcmod-plus = "^2.1.0"
msgpack = "1.0.5" # last version supported by pyodide
aio-usb-hotplug = "^6.0.0"
pyserial = "^3.5"
compose = "^1.5.0"
adrenaline = "^2.0.0"
httpx = ">=0.26.0"
igrf-model = "^1.1.3"
deprecated = "^1.2.14"
motioncapture = "1.0a2"
numpy = "^1.23.1"
scipy = "^1"

[tool.poetry.group.dev.dependencies]
coverage = {extras = ["toml"], version = "^7.4.0"}
pytest = "^7.4.4"
pytest-cov = "^4.1.0"
pytest-trio = ">=0.8.0"
pdoc = "^14.3.0"

[tool.poetry.scripts]
skybrushd = "flockwave.server.launcher:start"
skybrush-gateway = "flockwave.gateway.launcher:start"
skybrush-proxy = "flockwave.proxy.launcher:start"

[tool.ruff]
ignore = ["B905", "C901", "E402", "E501"]
line-length = 80
select = ["B", "C", "E", "F", "W"]
extend-exclude = ["src/flockwave/server/ext/socketio/vendor"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
